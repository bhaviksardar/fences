name: test

on:
  push:
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./sdk
      - run: python tests/test_local.py
      - run: pip install openai anthropic
      - run: python tests/test_instrument.py
      - run: pip install langchain-core langgraph
      - run: python tests/test_langchain.py
      - if: matrix.python != '3.9'  # the OpenAI Agents SDK needs Python 3.10+
        run: pip install openai-agents && python tests/test_openai_agents.py
