# Weekly update PRs for the GitHub Actions the workflows use and the SDKs' dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /sdk
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /sdk-js
    schedule:
      interval: weekly
